<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>NovaBrief — My History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>

  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/main.css"/>
  <link rel="stylesheet" href="/static/css/history.css"/>
</head>
<body>
<div class="bg-orb orb-1"></div><div class="bg-orb orb-2"></div>
<div class="grid-overlay"></div>

<header class="header">
  <div class="header-inner">
    <a href="/" class="logo"><div class="logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" fill="url(#hg)"/><defs><linearGradient id="hg" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#6C63FF"/><stop offset="1" stop-color="#00D4FF"/></linearGradient></defs></svg></div><span class="logo-text">NOVABRIEF</span></a>
    <nav class="main-nav">
      <a href="/app"     class="nav-link">Summarizer</a>
      <a href="/history" class="nav-link active">My History</a>
    </nav>
    <div class="header-right">
      <div class="theme-switcher-placeholder"></div>
      <span class="user-chip" id="userName"></span>
      <button class="btn-ghost btn-sm" id="logoutBtn">Sign Out</button>
    </div>
  </div>
</header>

<div class="modal-overlay" id="detailOverlay" style="display:none">
  <div class="modal-card glass-card detail-modal">
    <button class="modal-close" id="detailClose">✕</button>
    <div class="detail-header">
      <div class="detail-meta" id="detailMeta"></div>
      <div class="detail-actions">
        <button class="btn-ghost btn-sm" id="detailCopy"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy</button>
        <a class="btn-ghost btn-sm" id="detailPdf" href="#" target="_blank"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download PDF</a>
      </div>
    </div>
    <h2 class="detail-title" id="detailTitle"></h2>
    <div class="detail-body" id="detailBody"></div>
    <div class="detail-audio" id="detailAudio" style="display:none">
      <p class="rc-label">Audio Narration</p>
      <audio id="detailPlayer" controls style="width:100%;margin-top:8px"></audio>
      <a class="btn-ghost btn-sm mt-1" id="detailAudioDl" download>Download MP3</a>
    </div>
  </div>
</div>

<main class="history-main">
  <div class="history-header">
    <h1 class="history-title">My Summaries</h1>
    <p class="history-sub" id="historySub">Loading…</p>
    <a href="/app" class="btn-primary"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>New Summary</a>
  </div>

  <div class="history-filters glass-card">
    <div class="filter-group">
      <label class="filter-label">Type</label>
      <select class="filter-select" id="filterType">
        <option value="">All types</option>
        <option value="youtube">YouTube</option>
        <option value="pdf">PDF</option>
        <option value="text">Text</option>
        <option value="image">Image</option>
        <option value="audio">Audio</option>
        <option value="video">Video</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">Language</label>
      <select class="filter-select" id="filterLang">
        <option value="">All languages</option>
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="zh-cn">Chinese</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="ar">Arabic</option>
        <option value="hi">Hindi</option>
        <option value="ru">Russian</option>
      </select>
    </div>
    <div class="filter-group search-group">
      <label class="filter-label">Search</label>
      <input class="filter-input" type="text" id="filterSearch" placeholder="Search titles…"/>
    </div>
  </div>

  <div class="history-grid" id="historyGrid"></div>

  <div class="empty-state" id="emptyState" style="display:none">
    <div class="empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></div>
    <h3>No summaries yet</h3>
    <p>Summaries you generate while logged in will appear here.</p>
    <a href="/app" class="btn-primary mt-2">Generate your first summary</a>
  </div>
</main>

<script src="/static/js/summary-render.js"></script>
<script src="/static/js/history.js"></script>
</body>
</html>
